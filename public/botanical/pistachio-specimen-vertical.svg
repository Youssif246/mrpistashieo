<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1000" fill="none" class="botanical-stationery-vertical">
  <defs>
    <linearGradient id="vert-stem-grad" x1="0" y1="0" x2="300" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#768E37" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#8C9F4E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A4B86A" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="vert-leaf-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#768E37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8C9F4E" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <g class="vertical-stationery-group">
    <!-- Main Vertical Climbing Twig (Faint, elegant stem) -->
    <path d="M -10 -20 C 30 100 70 240 65 380 C 60 520 20 660 35 800 C 45 900 20 980 -10 1020" 
          stroke="url(#vert-stem-grad)" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- ═══ TIER 1: Upper Branch & Leaflet Cluster (Y: 80 - 220) ═══ -->
    <path d="M 50 120 C 100 130 160 145 220 170" stroke="url(#vert-stem-grad)" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <!-- Terminal Leaflet -->
    <path d="M 220 170 C 260 160 300 175 315 205 C 330 235 310 270 270 280 C 230 290 195 265 190 235 C 185 205 200 180 220 170 Z" 
          fill="url(#vert-leaf-fill)" stroke="#768E37" stroke-width="0.85" stroke-opacity="0.18"/>
    <!-- Lateral pairs -->
    <path d="M 160 145 C 170 115 195 95 225 95 C 255 95 275 120 270 150 C 265 180 235 200 205 195 C 180 190 165 170 160 145 Z" 
          fill="url(#vert-leaf-fill)" stroke="#768E37" stroke-width="0.8" stroke-opacity="0.16"/>
    <path d="M 175 155 C 160 185 135 205 105 205 C 75 205 55 180 60 150 C 65 120 95 105 125 110 C 150 115 170 135 175 155 Z" 
          fill="url(#vert-leaf-fill)" stroke="#768E37" stroke-width="0.8" stroke-opacity="0.16"/>

    <!-- ═══ TIER 2: Middle Cluster with Delicate Pistachio Fruit Outlines (Y: 340 - 520) ═══ -->
    <path d="M 65 380 C 120 370 180 370 240 380" stroke="url(#vert-stem-grad)" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M 240 380 C 285 360 330 370 350 400 C 370 430 355 468 315 480 C 275 492 235 470 225 438 C 215 408 225 390 240 380 Z" 
          fill="url(#vert-leaf-fill)" stroke="#768E37" stroke-width="0.85" stroke-opacity="0.18"/>
    <path d="M 180 370 C 190 335 220 315 250 320 C 280 325 295 355 285 385 C 275 415 245 430 215 425 C 190 420 178 395 180 370 Z" 
          fill="url(#vert-leaf-fill)" stroke="#768E37" stroke-width="0.8" stroke-opacity="0.15"/>
    <path d="M 195 375 C 185 410 160 430 130 425 C 100 420 85 390 95 360 C 105 330 135 315 165 320 C 190 325 200 350 195 375 Z" 
          fill="url(#vert-leaf-fill)" stroke="#768E37" stroke-width="0.8" stroke-opacity="0.15"/>

    <!-- Faint fruit panicle axis and shell outlines -->
    <path d="M 115 370 Q 110 405 102 445 Q 96 480 90 515" stroke="#8C7B65" stroke-width="0.9" stroke-opacity="0.18" fill="none"/>
    <ellipse cx="112" cy="400" rx="12" ry="17" transform="rotate(-15 112 400)" fill="#768E37" fill-opacity="0.04" stroke="#8C7B65" stroke-width="0.75" stroke-opacity="0.18"/>
    <ellipse cx="126" cy="415" rx="11" ry="16" transform="rotate(25 126 415)" fill="#768E37" fill-opacity="0.04" stroke="#8C7B65" stroke-width="0.75" stroke-opacity="0.18"/>
    <ellipse cx="104" cy="425" rx="12" ry="17" transform="rotate(-35 104 425)" fill="#768E37" fill-opacity="0.04" stroke="#8C7B65" stroke-width="0.75" stroke-opacity="0.18"/>
    <ellipse cx="118" cy="445" rx="11" ry="16" transform="rotate(15 118 445)" fill="#768E37" fill-opacity="0.04" stroke="#8C7B65" stroke-width="0.75" stroke-opacity="0.18"/>
    <ellipse cx="98" cy="460" rx="11" ry="17" transform="rotate(-20 98 460)" fill="#768E37" fill-opacity="0.04" stroke="#8C7B65" stroke-width="0.75" stroke-opacity="0.18"/>
    <ellipse cx="112" cy="475" rx="10" ry="15" transform="rotate(30 112 475)" fill="#768E37" fill-opacity="0.04" stroke="#8C7B65" stroke-width="0.75" stroke-opacity="0.18"/>

    <!-- ═══ TIER 3: Lower Foliage (Y: 680 - 840) ═══ -->
    <path d="M 35 680 C 80 700 140 730 200 770" stroke="url(#vert-stem-grad)" stroke-width="1.0" stroke-linecap="round" fill="none"/>
    <path d="M 200 770 C 240 775 275 805 275 840 C 275 875 245 905 205 905 C 165 905 135 875 145 840 C 155 805 180 775 200 770 Z" 
          fill="url(#vert-leaf-fill)" stroke="#768E37" stroke-width="0.85" stroke-opacity="0.16"/>
    <path d="M 140 730 C 160 705 190 695 220 705 C 250 715 260 745 245 775 C 230 805 200 815 170 805 C 145 795 135 765 140 730 Z" 
          fill="url(#vert-leaf-fill)" stroke="#768E37" stroke-width="0.8" stroke-opacity="0.14"/>
  </g>
</svg>
